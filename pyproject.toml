[project]
name = "mood-visualizer-scripts"
version = "0.0.0"
description = "Scripts used by the record workflow"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "PL"]
# PLR0913: keyword-only arguments keep long signatures readable.
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF003"]

[tool.ruff.format]
quote-style = "single"
