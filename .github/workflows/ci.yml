name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          # Tests do not need a browser.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run lint

      - run: npm run test:coverage

      - run: npm run build:ci

  scripts:
    name: Workflow scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: python -m pip install uv

      - run: uv sync --locked

      - run: uv run ruff check scripts

      - run: uv run ruff format --check scripts

      - run: uv run pytest

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
